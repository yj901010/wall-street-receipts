          def scrub_java(source, strip_literals):
              output = []
              index = 0
              state = "CODE"
              quote = None
              while index < len(source):
                  current = source[index]
                  following = source[index + 1] if index + 1 < len(source) else ""
                  if state == "CODE":
                      if current in {'"', "'"}:
                          state = "STRING" if current == '"' else "CHAR"
                          quote = current
                          output.append(
                              ('""' if current == '"' else "''")
                              if strip_literals else current
                          )
                          index += 1
                      elif current == "/" and following == "/":
                          state = "LINE_COMMENT"
                          index += 2
                      elif current == "/" and following == "*":
                          state = "BLOCK_COMMENT"
                          index += 2
                      else:
                          output.append(current)
                          index += 1
                  elif state in {"STRING", "CHAR"}:
                      if current == "\\" and following:
                          if not strip_literals:
                              output.extend((current, following))
                          index += 2
                      elif current == quote:
                          if not strip_literals:
                              output.append(current)
                          state = "CODE"
                          quote = None
                          index += 1
                      else:
                          if not strip_literals:
                              output.append(current)
                          index += 1
                  elif state == "LINE_COMMENT":
                      if current in "\r\n":
                          output.append(current)
                          state = "CODE"
                      index += 1
                  elif current == "*" and following == "/":
                      state = "CODE"
                      index += 2
                  else:
                      if current in "\r\n":
                          output.append(current)
                      index += 1
              require(
                  state not in {"STRING", "CHAR", "BLOCK_COMMENT"},
                  "Java source contains an unterminated lexical token",
              )
              return "".join(output)

