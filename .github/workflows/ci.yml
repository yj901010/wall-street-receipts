    - name: Guard benchmark-assignment golden runtime cardinality
      working-directory: apps/api
      run: 'python -c ''import sys; import xml.etree.ElementTree as ET; suite = ET.parse("target/surefire-reports/TEST-com.wallstreetreceipts.api.domain.outcome.benchmarkassignment.BenchmarkAssignmentSelectorGoldenTest.xml").getroot();
        expected = {"tests": "84", "failures": "0", "errors": "0", "skipped": "0"}; actual = {key: suite.attrib.get(key,
        "0") for key in expected}; sys.exit(f"BenchmarkAssignmentSelectorGoldenTest runtime cardinality
        changed: {actual}") if actual != expected else None; print("Verified BenchmarkAssignmentSelectorGoldenTest
