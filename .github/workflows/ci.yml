name: CI
'on':
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check out repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install CI validation dependencies
      run: python -m pip install --disable-pip-version-check -r scripts/ci/requirements.txt
    - name: Validate CI platform limits and refactor tests
      run: |
        python scripts/ci/validate_limits.py
        python -m unittest discover -s scripts/ci -p 'test_*.py'
    - name: Prepare isolated historical contract checkout
