                          "ticker": "NVDA",
                          "sector": "Technology",
                          "weight": 8.1,
                          "metric": 0.82,
                          "callCount": 18,
                          "timestamp": "2026-08-12T06:00:00Z",
                          "dataMode": "DEMO",
                          "provenanceId": "fixture-market-map-v1",
                      },
                      {
                          "assetId": "asset-msft",
                          "ticker": "MSFT",
                          "sector": "Technology",
                          "weight": 7.0,
                          "metric": 0.71,
                          "callCount": 14,
                          "timestamp": "2026-08-12T06:00:00Z",
                          "dataMode": "DEMO",
                          "provenanceId": "fixture-market-map-v1",
                      },
                      {
                          "assetId": "asset-aapl",
                          "ticker": "AAPL",
