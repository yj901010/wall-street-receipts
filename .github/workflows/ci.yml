          semantic_negative_cases.append(("cell later than asOf", future_cell, "Treemap cell is later than asOf"))
          duplicate_asset = deepcopy(documents)
          duplicate_asset[expected_paths[0]]["cells"][1]["assetId"] = "asset-nvda"
