          import json
          import re
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          fixture_dir = Path("fixtures/v1")
          manifest = json.loads((fixture_dir / "manifest.json").read_text(encoding="utf-8"))
