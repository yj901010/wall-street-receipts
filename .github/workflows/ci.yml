                          )
                          index += 1
                      elif current == "/" and following == "/":
                          state = "LINE_COMMENT"
                          index += 2
                      elif current == "/" and following == "*":
                          state = "BLOCK_COMMENT"
                          index += 2
                      else:
                          output.append(current)
                          index += 1
                  elif state in {"STRING", "CHAR"}:
                      if current == "\\" and following:
                          if not strip_literals:
                              output.extend((current, following))
                          index += 2
                      elif current == quote:
                          if not strip_literals:
                              output.append(current)
                          state = "CODE"
                          quote = None
                          index += 1
                      else:
