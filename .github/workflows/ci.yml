                  sector_totals[sector] += proxy
                  industry_totals[(sector, industry)] += proxy
              return sorted(
                  document["cells"],
                  key=lambda cell: (
                      -sector_totals[classification_label(cell["sector"], unclassified)],
                      classification_label(cell["sector"], unclassified),
                      -industry_totals[(
                          classification_label(cell["sector"], unclassified),
