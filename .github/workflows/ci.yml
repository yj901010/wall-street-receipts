  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out repository
      uses: actions/checkout@v6
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Enable pnpm
      run: corepack enable
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Chromium and system dependencies
      run: pnpm --dir apps/web exec playwright install --with-deps chromium
    - name: Lint
      run: pnpm --dir apps/web lint
    - name: Test
      run: pnpm --dir apps/web test
    - name: Build
      env:
        CALL_AUDIT_PROVIDER: fixture
        NEXT_PUBLIC_DATA_MODE: DEMO
      run: pnpm --dir apps/web build
    - name: End-to-end test
      env:
        CALL_AUDIT_PROVIDER: fixture
        NEXT_PUBLIC_DATA_MODE: DEMO
      run: pnpm --dir apps/web test:e2e
    - name: Verify SEC manifest API-mode failure boundary
      env:
        SEC_MANIFEST_AUDIT_PROVIDER: api
        API_BASE_URL: http://127.0.0.1:65534
        PLAYWRIGHT_BASE_URL: http://localhost:3011
        PLAYWRIGHT_REHEARSAL_NO_RETRIES: 'true'
        PORT: '3011'
      run: pnpm --dir apps/web exec playwright test e2e/sec-manifest-audit.spec.ts --project=chromium-1440
        --grep 'keeps exact SEC manifest evidence'
  call-audit-integration:
    name: Call audit integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wsr
          POSTGRES_USER: wsr
          POSTGRES_PASSWORD: wsr
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U wsr -d wsr" --health-interval 5s --health-timeout 5s --health-retries
          12
    steps:
    - name: Check out repository
      uses: actions/checkout@v6
    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
        cache: maven
        cache-dependency-path: apps/api/pom.xml
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Enable pnpm
      run: corepack enable
    - name: Install web dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Chromium and system dependencies
      run: pnpm --dir apps/web exec playwright install --with-deps chromium
    - name: Package API without repeating the API test job
      working-directory: apps/api
      run: |
        chmod +x mvnw
        ./mvnw -B -ntp -DskipTests package
    - name: Start fixture-backed Spring API
      env:
        APP_ENV: integration
        DATA_MODE: DEMO
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_DB: wsr
        POSTGRES_USER: wsr
        POSTGRES_PASSWORD: wsr
        MARKET_PROVIDER: fixture
        ANALYST_PROVIDER: fixture
        SERVER_TOMCAT_ACCESSLOG_ENABLED: 'true'
        SERVER_TOMCAT_ACCESSLOG_BUFFERED: 'false'
        SERVER_TOMCAT_BASEDIR: ${{ runner.temp }}/call-audit-tomcat
        SERVER_TOMCAT_ACCESSLOG_DIRECTORY: logs
        SERVER_TOMCAT_ACCESSLOG_PREFIX: call_audit_access
        SERVER_TOMCAT_ACCESSLOG_SUFFIX: .log
        SERVER_TOMCAT_ACCESSLOG_PATTERN: '%m %U%q %s'
      run: |
        java -jar apps/api/target/wall-street-receipts-api-0.0.1-SNAPSHOT.jar \
          > "${RUNNER_TEMP}/call-audit-api.log" 2>&1 &
        echo $! > "${RUNNER_TEMP}/call-audit-api.pid"
        for attempt in $(seq 1 60); do
          if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
            exit 0
          fi
          sleep 1
        done
        cat "${RUNNER_TEMP}/call-audit-api.log"
        exit 1
    - name: Exercise real Spring call-list and call-audit transports through Next
      env:
        CI: 'true'
        CALL_AUDIT_PROVIDER: api
        API_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_DATA_MODE: DEMO
      run: pnpm --dir apps/web exec playwright test call-revisions.spec.ts call-outcomes.spec.ts call-list-api.spec.ts
        --project=chromium-1280
    - name: Verify Next requested the real list and all audit resources
      shell: bash
      run: |
        python <<'PYTHON'
        import os
        from pathlib import Path

        log_root = Path(os.environ["RUNNER_TEMP"]) / "call-audit-tomcat" / "logs"
        logs = sorted(log_root.glob("call_audit_access*.log"))
        if not logs:
            raise SystemExit(f"Spring access log is missing under {log_root}")
        access = "\n".join(path.read_text(encoding="utf-8") for path in logs)
        access_lines = {line.strip() for line in access.splitlines() if line.strip()}
        required = {
            "GET /v1/calls?dataMode=DEMO&page=0&size=25&sort=eventTime&order=desc 200",
            "GET /v1/calls?assetId=asset-nvda&ticker=nvda&institutionId=inst-gs&analystId=analyst-demo-b&direction=BULLISH&status=ACTIVE&dataMode=DEMO&from=2026-08-11T00%3A00%3A00.000Z&to=2026-08-12T00%3A00%3A00.000Z&page=0&size=1&sort=capturedAt&order=asc 200",
            "GET /v1/calls?dataMode=DEMO&page=0&size=1&sort=eventTime&order=desc 200",
            "GET /v1/calls?dataMode=DEMO&page=1&size=1&sort=eventTime&order=desc 200",
            "GET /v1/calls?ticker=TSLA&dataMode=DEMO&page=0&size=1&sort=eventTime&order=desc 200",
            "GET /v1/calls/demo-call-002- 200",
            "GET /v1/calls/demo-call-002/context- 200",
            "GET /v1/calls/demo-call-002/revisions- 200",
            "GET /v1/calls/demo-call-002/outcomes- 200",
            "GET /v1/calls/demo-call-001- 200",
            "GET /v1/calls/demo-call-001/context- 200",
            "GET /v1/calls/demo-call-001/revisions- 200",
            "GET /v1/calls/demo-call-001/outcomes- 200",
        }
        missing = sorted(required - access_lines)
        if missing:
            raise SystemExit(f"Next did not exercise the complete Spring audit: {missing}\n{access}")
        print("Verified list plus populated and known-empty detail/context/revision/outcome reads through Spring")
        PYTHON
    - name: Print integration logs on failure
      if: failure()
      shell: bash
      run: |
        test ! -f "${RUNNER_TEMP}/call-audit-api.log" || cat "${RUNNER_TEMP}/call-audit-api.log"
        find "${RUNNER_TEMP}/call-audit-tomcat" -type f -name '*.log' -print -exec cat {} \; 2>/dev/null || true
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out repository
      uses: actions/checkout@v6
    - name: Set up Java
      uses: actions/setup-java@v5
