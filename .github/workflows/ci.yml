    - name: Make Maven wrapper executable
      run: chmod +x apps/api/mvnw
    - name: Verify
      working-directory: apps/api
      env:
        APP_ENV: test
        DATA_MODE: DEMO
      run: ./mvnw -B -ntp verify
    - name: Run SEC operator collection attempt focused tests
      working-directory: apps/api
      run: ./mvnw -B -ntp -Dtest=SecFilingHistoryCollectionAttemptTest,ExecuteSecFilingHistoryCollectionAttemptServiceTest,SingleJvmSecFilingHistoryCollectionAttemptMutexTest,SecFilingHistoryCollectionAttemptConfigurationTest,SecProviderExceptionTypedContractTest,SecFilingHistoryCollectionAttemptPersistenceTest,FilingCollectionAttemptPostgreSqlTest
        test
    - name: Run local operator attempt API focused tests
      working-directory: apps/api
      run: ./mvnw -B -ntp -Dtest=OperatorApiPropertiesTest,OperatorApiDisabledSecurityTest,OperatorApiSecurityTest,OperatorApiLoopbackBindingTest,OperatorSecCollectionAttemptApiConfigurationTest,SecFilingHistoryCollectionAttemptQueryServiceTest,OperatorSecCollectionAttemptApiTest,OperatorSecCollectionAttemptIntegrationTest
        test
    - name: Run exact SEC manifest audit API focused tests
      working-directory: apps/api
      run: ./mvnw -B -ntp -Dtest=SecFilingHistoryManifestAuditQueryServiceTest,SecFilingHistoryManifestAuditApiTest,FilingHistoryCollectionManifestPostgreSqlTest
