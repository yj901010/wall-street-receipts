spring:
  application:
    name: wall-street-receipts-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:wsr}
    username: ${POSTGRES_USER:wsr}
    password: ${POSTGRES_PASSWORD:wsr}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: ${spring.application.name}
    data-mode: ${DATA_MODE:fixture}

app:
  providers:
    market: ${MARKET_PROVIDER:fixture}
    analyst: ${ANALYST_PROVIDER:fixture}
