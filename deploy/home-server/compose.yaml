name: wall-street-receipts-home

x-service-logging: &service-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-app-hardening: &app-hardening
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  logging: *service-logging

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wsr
      POSTGRES_USER: wsr
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --data-checksums
      PGTZ: UTC
      TZ: UTC
    secrets:
      - source: postgres_password
        target: postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 256m
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    logging: *service-logging

  api:
    image: wall-street-receipts-api:${WSR_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/home-server/api.Dockerfile
      target: runtime
      args:
        WSR_GIT_SHA: ${WSR_IMAGE_TAG:-local}
    environment:
      APP_ENV: production
      DATA_MODE: DEMO
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: wsr
      POSTGRES_USER: wsr
      SPRING_CONFIG_LOCATION: classpath:/
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      MARKET_PROVIDER: fixture
      ANALYST_PROVIDER: fixture
      SEC_PROVIDER_ENABLED: "false"
      SEC_BASE_URL: http://127.0.0.1:9
      SEC_CONTACT_EMAIL: ""
      OPERATOR_API_ENABLED: "false"
      OPERATOR_API_TOKEN_SHA256: ""
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Duser.timezone=UTC
      TZ: UTC
    secrets:
      - source: postgres_password
        target: spring.datasource.password
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    networks:
      - app-internal
      - db-internal
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "3"
        - http://127.0.0.1:8080/actuator/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    tmpfs:
      - /tmp:size=128m,uid=10001,gid=10001,mode=1770
    stop_grace_period: 30s
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    <<: *app-hardening

  web:
    image: wall-street-receipts-web:${WSR_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/home-server/web.Dockerfile
      target: runtime
      args:
        WSR_GIT_SHA: ${WSR_IMAGE_TAG:-local}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_DATA_MODE: DEMO
      CALL_AUDIT_PROVIDER: api
      API_BASE_URL: http://api:8080
      MARKET_PROVIDER: fixture
      ANALYST_PROVIDER: fixture
      SP500_HISTORY_PROVIDER: fixture
      MARKET_BOARD_PROVIDER: fixture
      METHODOLOGY_PROVIDER: fixture
      INSTITUTION_DIRECTORY_PROVIDER: fixture
      ANALYST_DIRECTORY_PROVIDER: fixture
      MARKET_MAP_PROVIDER: fixture
      MARKET_TREEMAP_PROVIDER: fixture
      MACRO_PROVIDER: fixture
      MEDIA_PROVIDER: fixture
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      TZ: UTC
    depends_on:
      api:
        condition: service_healthy
        restart: true
    networks:
      - edge-internal
      - app-internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=1000,mode=1770
      - /workspace/apps/web/.next/cache:size=128m,uid=1000,gid=1000,mode=0700
    stop_grace_period: 30s
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    <<: *app-hardening

  caddy-production:
    image: wall-street-receipts-caddy:${WSR_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: caddy.Dockerfile
      target: runtime
      args:
        WSR_GIT_SHA: ${WSR_IMAGE_TAG:-local}
    profiles:
      - production
    user: "65532:65532"
    environment:
      WSR_DOMAIN: ${WSR_DOMAIN:-invalid.example}
      WSR_ACME_EMAIL: ${WSR_ACME_EMAIL:-invalid@example.invalid}
      WSR_DEFAULT_SNI: ${WSR_DOMAIN:-invalid.example}
    ports:
      - target: 80
        published: "80"
        protocol: tcp
      - target: 443
        published: "443"
        protocol: tcp
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
        restart: true
    networks:
      - public-egress
      - edge-internal
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --output
        - /dev/null
        - --max-time
        - "3"
        - http://127.0.0.1:2019/config/
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=32m,uid=65532,gid=65532,mode=0700
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    logging: *service-logging

  caddy-rehearsal:
    image: wall-street-receipts-caddy:${WSR_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: caddy.Dockerfile
      target: runtime
      args:
        WSR_GIT_SHA: ${WSR_IMAGE_TAG:-local}
    profiles:
      - rehearsal
    user: "65532:65532"
    environment:
      WSR_DOMAIN: https://127.0.0.1:8443
      WSR_ACME_EMAIL: operator@wsr.invalid
      WSR_DEFAULT_SNI: 127.0.0.1
    ports:
      - target: 8443
        published: ${WSR_REHEARSAL_PORT:-18080}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
    depends_on:
      web:
        condition: service_healthy
        restart: true
    networks:
      - public-egress
      - edge-internal
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --output
        - /dev/null
        - --max-time
        - "3"
        - http://127.0.0.1:2019/config/
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /data:size=32m,uid=65532,gid=65532,mode=0700
      - /config:size=16m,uid=65532,gid=65532,mode=0700
      - /tmp:size=32m,uid=65532,gid=65532,mode=0700
    restart: unless-stopped
    stop_grace_period: 15s
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    logging: *service-logging

secrets:
  postgres_password:
    file: ${WSR_POSTGRES_PASSWORD_FILE:?Set WSR_POSTGRES_PASSWORD_FILE to an absolute secret-file path}

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  public-egress:
  edge-internal:
    internal: true
  app-internal:
    internal: true
  db-internal:
    internal: true
